name: Deploy to Production Cloudflare

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout current version only
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare public website files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          rsync -a --delete \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/.idea/' \
            --exclude '/.DS_Store' \
            --exclude '/.gitignore' \
            --exclude '/dist/' \
            --exclude '/infrastructure/' \
            --exclude '/scripts/' \
            --exclude '/Readme.txt' \
            --exclude '/wrangler.jsonc' \
            --exclude '*.php' \
            ./ dist/

          test -f dist/index.html
          test -f dist/404.html
          test ! -e dist/.git

      - name: Deploy static website to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.0"
          command: deploy --config wrangler.jsonc

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download the MealBets App</title>
  <meta name="description" content="Continue to the MealBets school lunch ordering app for iOS or Android." />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="3; URL=https://mealbets.com/" />
  <script>
    function getMobileOperatingSystem() {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;

      // Windows Phone must come first because its UA also contains "Android"
      if (/windows phone/i.test(userAgent)) {
        return "Windows Phone";
      }

      if (/android/i.test(userAgent)) {
        return "Android";
      }

      if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        return "iOS";
      }

      return "unknown";
    }</script>

  <script>
    function DetectAndServe(){
      let os = getMobileOperatingSystem();
      if (os === "Android") {
        window.location.href = "https://play.google.com/store/apps/details?id=com.mealbets.user";
      } else if (os === "iOS") {
        window.location.href = "https://apps.apple.com/app/mealbets/id6473510220";
      } else if (os === "Windows Phone") {
        window.location.href = "https://mealbets.com/";
      } else {
        window.location.href = "https://mealbets.com/";
      }
    }
  </script>
</head>
<body onload="DetectAndServe()">
</body>
</html>
